<!doctype html>
<!-- La imagen que sale al compartir la web (public/og.png, 1200x630). Para regenerarla:
     chromium-browser --headless=new --hide-scrollbars --window-size=1200,630 \
       --screenshot=public/og.png scripts/og.html
     Los iconos son los de src/components/AppIcon.astro: si cambia uno, cópialo también aquí. -->
<html lang="es">

        align-items: center; gap: 40px; padding: 0 80px; box-sizing: border-box;
        background: radial-gradient(60% 80% at 85% 50%, rgb(122 69 196 / .45), transparent 70%), #0a0a0a; }
      .brand { font-size: 38px; font-weight: 750; letter-spacing: -.03em; }
      h1 { margin: 44px 0 0; font-size: 76px; line-height: 1; letter-spacing: -.045em; font-weight: 750; }
      h1 span { display: block; color: #737373; }
      p { margin: 28px 0 0; color: #a7a7a7; font-size: 26px; }
      .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 26px; }
      .grid svg { width: 100%; border-radius: 22%; box-shadow: 0 18px 40px rgb(0 0 0 / .5); }
    </style>
  </head>
